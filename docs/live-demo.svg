<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-label="Visit FarMe live at farme-simulation.netlify.app" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.btn{transform-origin:300px 70px;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.ring{transform-origin:300px 70px;fill:none;stroke:#81945c;stroke-width:3;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.12,1.35);opacity:0}}
.dot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.arrow{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.leafL,.leafR{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.leafR{animation-delay:.3s}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="ring" x="30" y="20" width="540" height="100" rx="26"/>
<g class="btn">
<rect x="34" y="30" width="540" height="100" rx="26" fill="#202808"/>
<rect x="30" y="20" width="540" height="100" rx="26" fill="#34452b" stroke="#202808" stroke-width="4"/>
<rect x="30" y="20" width="540" height="46" rx="26" fill="#ffffff" opacity=".07"/>
<g transform="translate(0 0)">
<g transform="translate(86 78)">
<path d="M0 22V-2" stroke="#e4edcf" stroke-width="4" stroke-linecap="round" fill="none"/>
<path class="leafL" d="M0 4C-14 4-22-6-22-16C-10-16 0-8 0 4Z" fill="#a9b88a" stroke="#e4edcf" stroke-width="2.5" stroke-linejoin="round"/>
<path class="leafR" d="M0 4C14 4 22-6 22-16C10-16 0-8 0 4Z" fill="#81945c" stroke="#e4edcf" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M-18 26C-10 18 10 18 18 26Z" fill="#c4866d"/></g>
<text x="140" y="71" textLength="290" lengthAdjust="spacingAndGlyphs" font-family="Georgia,'Trebuchet MS',serif" font-size="34" font-weight="800" fill="#fffdf5">Visit FarMe Live</text>
<circle class="dot" cx="148" cy="95" r="6" fill="#7bd36b"/>
